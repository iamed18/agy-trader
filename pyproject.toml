[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-trader"
version = "0.1.0"
description = "Algorithmic trading system for Alpaca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "yfinance>=0.2.40"
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.40",
    "torch>=2.2",
    "scipy>=1.13"
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML>=6.0"
]

[project.scripts]
agy = "agy_trader.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

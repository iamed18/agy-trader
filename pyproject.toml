[project]
name = "agy-trader-workspace"
version = "0.1.0"
description = "Algorithmic trading system monorepo for Alpaca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agy-core",
    "agy-ops",
]

[project.optional-dependencies]
nlp = [
    "agy-core[nlp]",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML>=6.0",
]
research = [
    "cvxpy>=1.6",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/agy-core", "packages/agy-ops"]

[tool.uv.sources]
agy-core = { workspace = true }
agy-ops = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["agy_trader", "agy_ops"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/agy-core/src", "packages/agy-ops/src"]
explicit_package_bases = true
ignore_missing_imports = true
strict = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
